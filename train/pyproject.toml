[project]
name = "ai-plastic-spotter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "pillow>=12.0.0",
    "ultralytics>=8.3.233",
]

# Intel XPU dependencies (install with: uv sync --extra xpu)
[project.optional-dependencies]
xpu = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "pytorch-triton-xpu>=3.5.0 ; sys_platform == 'win32' or sys_platform == 'linux'",
]

# NVIDIA CUDA dependencies (install with: uv sync --extra cuda)
cuda = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

# Apple Silicon MPS dependencies (install with: uv sync --extra mps)
mps = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-xpu", marker = "extra == 'xpu' and (sys_platform == 'win32' or sys_platform == 'linux')" },
  { index = "pytorch-cu124", marker = "extra == 'cuda' and extra != 'xpu' and (sys_platform == 'win32' or sys_platform == 'linux')" },
]
torchvision = [
  { index = "pytorch-xpu", marker = "extra == 'xpu' and (sys_platform == 'win32' or sys_platform == 'linux')" },
  { index = "pytorch-cu124", marker = "extra == 'cuda' and extra != 'xpu' and (sys_platform == 'win32' or sys_platform == 'linux')" },
]
pytorch-triton-xpu = [
  { index = "pytorch-xpu", marker = "extra == 'xpu' and (sys_platform == 'win32' or sys_platform == 'linux')" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
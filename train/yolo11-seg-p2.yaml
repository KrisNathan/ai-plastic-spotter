# Ultralytics YOLO11-seg-P2 instance segmentation model for small objects
# Includes P2/4, P3/8, P4/16, and P5/32 outputs

# Parameters
nc: 80 
scales:
  # n: [0.50, 0.25, 1024]
  # s: [0.50, 0.50, 1024]
  # m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  # x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n-P2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P4 up)
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P3 up)
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3)

  # --- NEW P2 SECTION ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (P2 up)
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2 (Layer 2 output)
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4 - tiny objects)
  # ----------------------

  - [-1, 1, Conv, [128, 3, 2]] # 20 (back to P3)
  - [[-1, 16], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]] # 23 (back to P4)
  - [[-1, 13], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]] # 26 (back to P5)
  - [[-1, 10], 1, Concat, [1]] # 27
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32)
  
  # Final detection head - SWAPPED ORDER
  # We put 22 (P3) FIRST so the Mask Prototypes use Stride 8 (Standard Size).
  # We keep 19 (P2) second so we still detect small objects, but don't mask them at high-res.
  - [[22, 19, 25, 28], 1, Segment, [nc, 32, 256]] # Segment(P3, P2, P4, P5)
